name: CI

# Docs-only changes (markdown anywhere) don't touch anything CI builds.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  crosscheck-swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Nanako0129/TokenBar
          ref: 704426e8df9acfb8e82fe4bf3b7ed3e5adbc2fea
          path: tokenbar-mac
          submodules: recursive
      - uses: actions/checkout@v6
        with:
          path: tokenbar-windows
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tokenbar-mac -> target
      - name: build Swift expected outputs (canonical SHA)
        shell: bash
        env:
          TOKENBAR_WINDOWS: ${{ github.workspace }}/tokenbar-windows
          TOKENBAR_MAC_CANONICAL: ${{ github.workspace }}/tokenbar-mac
        run: |
          (
            cd "$TOKENBAR_MAC_CANONICAL"
            cargo build --release --locked
          )
          rm -rf "$TOKENBAR_WINDOWS/crosscheck/swift-out"
          mkdir -p "$TOKENBAR_WINDOWS/crosscheck/swift-out"
          (
            cd "$TOKENBAR_MAC_CANONICAL"
            TZ=Asia/Taipei swift run crosscheck-harness \
              "$TOKENBAR_WINDOWS/crosscheck/fixtures" \
              "$TOKENBAR_WINDOWS/crosscheck/swift-out" \
              -AppleLanguages "(en)"
          )
          (
            cd "$TOKENBAR_MAC_CANONICAL"
            TZ=Asia/Taipei swift run crosscheck-harness \
              "$TOKENBAR_WINDOWS/crosscheck/fixtures" \
              "$TOKENBAR_WINDOWS/crosscheck/swift-out" \
              provider-quota-pace-v3 \
              -AppleLanguages "(en)"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: crosscheck-swift-out
          path: tokenbar-windows/crosscheck/swift-out

  build:
    needs: crosscheck-swift
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
      # Full x64 artifact (also covered by deployment-matrix). Kept here so the
      # primary build job still fails closed on the release contract early.
      - name: Phase 10 App artifact evidence (x64 Full)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "tokenbar-phase10-x64"
          ./scripts/build-app-artifact.ps1 -Rid win-x64 -OutputRoot $root -DeploymentMode Full
      - uses: actions/upload-artifact@v4
        with:
          name: app-evidence-win-x64-full
          path: |
            ${{ runner.temp }}/tokenbar-phase10-x64/*/evidence.json
            ${{ runner.temp }}/tokenbar-phase10-x64/*/*.zip.sha256
          if-no-files-found: error
          retention-days: 3
      - uses: actions/download-artifact@v4
        with:
          name: crosscheck-swift-out
          path: crosscheck/swift-out
      # Directory.Build.targets owns the only Platform/RID to Rust-target
      # mapping and produces the native source consumed by managed builds.
      - name: restore locked NuGet graphs
        run: |
          dotnet restore src/TokenBar.slnx --locked-mode
          dotnet restore src/TokenBar.App/TokenBar.App.csproj --locked-mode
          dotnet restore spike/D3DGraphSpike/D3DGraphSpike.csproj --locked-mode
          dotnet restore src/TokenBar.CrossCheck/TokenBar.CrossCheck.csproj --locked-mode
      - name: cargo build native source (x64, locked)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: build native DLL (x64 via shared mapping)
        run: dotnet msbuild src/TokenBar.Smoke/TokenBar.Smoke.csproj -t:BuildTbNative -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:TbNativeCargoLocked=true -p:RestoreLockedMode=true
      - name: cargo test (workspace, locked)
        run: cargo test --workspace --release --locked
      - name: build Core.Tests (x64)
        run: dotnet build src/TokenBar.Core.Tests/TokenBar.Core.Tests.csproj -c Release -p:Platform=x64 --no-restore
      - name: test Core.Tests (x64)
        run: dotnet test src/TokenBar.Core.Tests/TokenBar.Core.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore
      - name: build WinUI App (x64)
        run: dotnet build src/TokenBar.App/TokenBar.App.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 --no-restore
      - name: build Smoke (x64)
        run: dotnet build src/TokenBar.Smoke/TokenBar.Smoke.csproj -c Release -p:Platform=x64 --no-restore
      - name: P/Invoke smoke (all entry points; x64 runtime)
        run: dotnet run --project src/TokenBar.Smoke -c Release -p:Platform=x64 --no-build --no-restore
        env:
          # Keep credential-bound agent usage and live pricing refreshes out of
          # deterministic CI; their decode paths are covered on dev machines.
          TB_SMOKE_SKIP_NETWORK: "1"
          TOKSCALE_CONFIG_DIR: ${{ runner.temp }}\tb-smoke-config
          TOKSCALE_PRICING_CACHE_ONLY: "1"
      # CrossCheck is platform-neutral and deliberately has no Platform/RID.
      - name: CrossCheck (no Platform or RID)
        shell: bash
        run: |
          MSYS_NO_PATHCONV=1 tzutil.exe /s "Taipei Standard Time"
          TZ=Asia/Taipei dotnet run \
            --project src/TokenBar.CrossCheck \
            -c Release --no-restore -- \
            crosscheck/fixtures \
            crosscheck/csharp-out
          TZ=Asia/Taipei dotnet run \
            --project src/TokenBar.CrossCheck \
            -c Release --no-restore -- \
            crosscheck/fixtures \
            crosscheck/csharp-out \
            provider-quota-pace-v3
      - name: compare CrossCheck outputs
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: python3 crosscheck/diff.py crosscheck/swift-out crosscheck/csharp-out
      # Hermetic runtime check: point HOME at a synthetic Claude tree and put
      # one valid Codex session under a different CODEX_HOME root. The strict
      # client assertions make a pre-A1 binary fail instead of silently passing
      # with only the HOME-backed Claude messages.
      - name: hermetic parse smoke (isolated Claude, relocated Codex; x64 runtime)
        shell: pwsh
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "tb-home"
          $codex = Join-Path $env:RUNNER_TEMP "tb-codex-root"
          @($fx, $codex) | ForEach-Object {
            Remove-Item -LiteralPath $_ -Recurse -Force -ErrorAction SilentlyContinue
          }
          $appData = Join-Path $fx "appdata"
          $localAppData = Join-Path $fx "local-appdata"
          $xdgData = Join-Path $fx "xdg-data"
          $config = Join-Path $fx "config"
          $emptyRoots = @(
            (Join-Path $fx "grok"),
            (Join-Path $fx "gemini"),
            (Join-Path $fx "hermes"),
            (Join-Path $fx "codebuff"),
            (Join-Path $fx "jcode"),
            (Join-Path $fx "gjc"),
            (Join-Path $fx "goose"),
            (Join-Path $fx "headless")
          )
          @(
            "$fx\.claude\projects\ci",
            "$codex\sessions\ci",
            $appData,
            $localAppData,
            $xdgData,
            $config
          ) + $emptyRoots | ForEach-Object {
            New-Item -ItemType Directory -Force -Path $_ | Out-Null
          }
          # dirs::data_local_dir uses the Windows Known Folder API rather than
          # LOCALAPPDATA. A hosted runner must have no host Zed DB to ingest.
          $hostZed = Join-Path `
            ([Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)) `
            "Zed\threads\threads.db"
          if (Test-Path -LiteralPath $hostZed) {
            throw "host profile contains a Zed session DB: $hostZed"
          }
          $now = [DateTime]::UtcNow
          # Only Codex is inside the live 10-minute window, so the aggregate
          # token rate must equal the Codex trace rate. Claude remains visible
          # to graph/model/hourly/agents and the strict filter-delta checks.
          $t1 = $now.AddHours(-2).AddSeconds(-20).ToString("yyyy-MM-ddTHH:mm:ss.fffZ", [Globalization.CultureInfo]::InvariantCulture)
          $t2 = $now.AddHours(-2).AddSeconds(-10).ToString("yyyy-MM-ddTHH:mm:ss.fffZ", [Globalization.CultureInfo]::InvariantCulture)
          $t3 = $now.AddSeconds(-10).ToString("yyyy-MM-ddTHH:mm:ss.fffZ", [Globalization.CultureInfo]::InvariantCulture)
          @"
          {"type":"assistant","timestamp":"$t1","requestId":"req_ci1","message":{"id":"msg_ci1","model":"claude-sonnet-4","usage":{"input_tokens":123,"output_tokens":45}}}
          "@ | Set-Content -Path "$fx\.claude\projects\ci\session-1.jsonl" -Encoding utf8
          @"
          {"type":"assistant","timestamp":"$t2","requestId":"req_ci2","message":{"id":"msg_ci2","model":"claude-sonnet-4","usage":{"input_tokens":10,"output_tokens":5}}}
          "@ | Set-Content -Path "$fx\.claude\projects\ci\session-2.jsonl" -Encoding utf8
          @"
          {"timestamp":"$t3","type":"session_meta","payload":{"id":"01900000-0000-7000-8000-000000000001","source":"interactive","model_provider":"openai","cwd":"C:/ci/codex"}}
          {"timestamp":"$t3","type":"turn_context","payload":{"model":"gpt-5.4"}}
          {"timestamp":"$t3","type":"event_msg","payload":{"type":"user_message","message":"ci smoke"}}
          {"timestamp":"$t3","type":"event_msg","payload":{"type":"token_count","info":{"total_token_usage":{"input_tokens":120,"cached_input_tokens":20,"output_tokens":40,"reasoning_output_tokens":10},"last_token_usage":{"input_tokens":120,"cached_input_tokens":20,"output_tokens":40,"reasoning_output_tokens":10}}}}
          "@ | Set-Content -Path "$codex\sessions\ci\session.jsonl" -Encoding utf8
          $env:HOME = $fx
          $env:CODEX_HOME = $codex
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localAppData
          $env:XDG_DATA_HOME = $xdgData
          $env:TOKSCALE_CONFIG_DIR = $config
          $env:GROK_HOME = $emptyRoots[0]
          $env:GEMINI_CLI_HOME = $emptyRoots[1]
          $env:HERMES_HOME = $emptyRoots[2]
          $env:CODEBUFF_DATA_DIR = $emptyRoots[3]
          $env:JCODE_HOME = $emptyRoots[4]
          $env:GJC_CODING_AGENT_DIR = $emptyRoots[5]
          $env:GOOSE_PATH_ROOT = $emptyRoots[6]
          $env:TOKSCALE_HEADLESS_DIR = $emptyRoots[7]
          $env:TOKSCALE_EXTRA_DIRS = ""
          $env:COPILOT_OTEL_FILE_EXPORTER_PATH = Join-Path $fx "missing-copilot.jsonl"
          $env:TOKSCALE_PRICING_CACHE_ONLY = "1"
          $env:TB_SMOKE_MIN_MESSAGES = "3"
          $env:TB_SMOKE_EXPECT_CLIENT = "codex"
          $env:TB_SMOKE_SKIP_NETWORK = "1"
          dotnet run --project src/TokenBar.Smoke -c Release -p:Platform=x64 --no-build --no-restore
      # Self-contained smoke bundle (runtime + native dll included): lets a
      # bare Windows verification box run the full entry-point sweep with
      # nothing installed.
      - name: publish smoke bundle (win-x64 self-contained)
        run: dotnet publish src/TokenBar.Smoke/TokenBar.Smoke.csproj -c Release -r win-x64 --self-contained -o out/smoke-win-x64 --no-restore
      # Execute the published file itself, with the same isolated fixture and
      # network skip as the x64 build smoke; this is the published-runtime gate.
      - name: run published smoke bundle (win-x64 runtime)
        shell: pwsh
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "tb-home"
          $codex = Join-Path $env:RUNNER_TEMP "tb-codex-root"
          $appData = Join-Path $fx "appdata"
          $localAppData = Join-Path $fx "local-appdata"
          $xdgData = Join-Path $fx "xdg-data"
          $config = Join-Path $fx "config"
          $emptyRoots = @(
            (Join-Path $fx "grok"),
            (Join-Path $fx "gemini"),
            (Join-Path $fx "hermes"),
            (Join-Path $fx "codebuff"),
            (Join-Path $fx "jcode"),
            (Join-Path $fx "gjc"),
            (Join-Path $fx "goose"),
            (Join-Path $fx "headless")
          )
          $env:HOME = $fx
          $env:CODEX_HOME = $codex
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localAppData
          $env:XDG_DATA_HOME = $xdgData
          $env:TOKSCALE_CONFIG_DIR = $config
          $env:GROK_HOME = $emptyRoots[0]
          $env:GEMINI_CLI_HOME = $emptyRoots[1]
          $env:HERMES_HOME = $emptyRoots[2]
          $env:CODEBUFF_DATA_DIR = $emptyRoots[3]
          $env:JCODE_HOME = $emptyRoots[4]
          $env:GJC_CODING_AGENT_DIR = $emptyRoots[5]
          $env:GOOSE_PATH_ROOT = $emptyRoots[6]
          $env:TOKSCALE_HEADLESS_DIR = $emptyRoots[7]
          $env:TOKSCALE_EXTRA_DIRS = ""
          $env:COPILOT_OTEL_FILE_EXPORTER_PATH = Join-Path $fx "missing-copilot.jsonl"
          $env:TOKSCALE_PRICING_CACHE_ONLY = "1"
          $env:TB_SMOKE_MIN_MESSAGES = "3"
          $env:TB_SMOKE_EXPECT_CLIENT = "codex"
          $env:TB_SMOKE_SKIP_NETWORK = "1"
          $now = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ss.fffZ", [Globalization.CultureInfo]::InvariantCulture)
          $codexSession = Join-Path $codex "sessions\ci\session.jsonl"
          $codexJsonl = Get-Content -LiteralPath $codexSession -Raw
          $codexJsonl = $codexJsonl -replace '"timestamp":"[^"]+"', ('"timestamp":"{0}"' -f $now)
          Set-Content -LiteralPath $codexSession -Value $codexJsonl -Encoding utf8
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "out\smoke-win-x64")
          try {
            & ".\TokenBar.Smoke.exe"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-win-x64
          path: out/smoke-win-x64
          retention-days: 3

  # Cross-build/package only. This x64 runner never executes ARM64 binaries;
  # real ARM64 runtime coverage remains a merge gate on the ARM64 VM.
  arm64-cross:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
      - name: Phase 10 App artifact evidence (ARM64 Full)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "tokenbar-phase10-arm64"
          ./scripts/build-app-artifact.ps1 -Rid win-arm64 -OutputRoot $root -DeploymentMode Full
      - uses: actions/upload-artifact@v4
        with:
          name: app-evidence-win-arm64-full
          path: |
            ${{ runner.temp }}/tokenbar-phase10-arm64/*/evidence.json
            ${{ runner.temp }}/tokenbar-phase10-arm64/*/*.zip.sha256
          if-no-files-found: error
          retention-days: 3
      - name: restore locked NuGet graphs (ARM64)
        run: |
          dotnet restore src/TokenBar.App/TokenBar.App.csproj --locked-mode
          dotnet restore src/TokenBar.Smoke/TokenBar.Smoke.csproj --locked-mode
      - name: cargo build native source (ARM64, locked)
        run: cargo build --release --locked --target aarch64-pc-windows-msvc
      - name: build native DLL (ARM64 cross-build only)
        run: dotnet msbuild src/TokenBar.Smoke/TokenBar.Smoke.csproj -t:BuildTbNative -p:Configuration=Release -p:Platform=ARM64 -p:RuntimeIdentifier=win-arm64 -p:TbNativeCargoLocked=true -p:RestoreLockedMode=true
      - name: build WinUI App (ARM64 cross-build only)
        run: dotnet build src/TokenBar.App/TokenBar.App.csproj -c Release -p:Platform=ARM64 -p:RuntimeIdentifier=win-arm64 --no-restore
      - name: publish Smoke bundle (win-arm64 cross-package validation)
        run: dotnet publish src/TokenBar.Smoke/TokenBar.Smoke.csproj -c Release -r win-arm64 --self-contained -o out/smoke-win-arm64 --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-win-arm64
          path: out/smoke-win-arm64
          retention-days: 3

  # Full/Lite × win-x64/win-arm64 packaging matrix. Lite asserts are enforced
  # by build-app-artifact.ps1 + package-velopack.ps1 (no bundled coreclr,
  # runtimeconfig-derived framework, channel, nuspec runtimeDependencies, PE).
  deployment-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            mode: Full
            rust_target: x86_64-pc-windows-msvc
          - rid: win-x64
            mode: Lite
            rust_target: x86_64-pc-windows-msvc
          - rid: win-arm64
            mode: Full
            rust_target: aarch64-pc-windows-msvc
          - rid: win-arm64
            mode: Lite
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: deploy-${{ matrix.rid }}-${{ matrix.mode }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
      - name: App artifact (${{ matrix.mode }} / ${{ matrix.rid }})
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "tb-artifact-${{ matrix.mode }}-${{ matrix.rid }}"
          ./scripts/build-app-artifact.ps1 -Rid ${{ matrix.rid }} -OutputRoot $root -DeploymentMode ${{ matrix.mode }}
          $evidence = Get-ChildItem -LiteralPath $root -Recurse -Filter evidence.json | Select-Object -First 1
          if ($null -eq $evidence) { throw "evidence.json missing" }
          $doc = Get-Content -LiteralPath $evidence.FullName -Raw | ConvertFrom-Json
          if ($doc.deploymentMode -cne "${{ matrix.mode }}") {
            throw "evidence.deploymentMode mismatch: $($doc.deploymentMode)"
          }
          if ([int]$doc.muiCount -le 0) {
            throw "evidence.muiCount must be > 0"
          }
          if ("${{ matrix.mode }}" -eq "Lite") {
            if ([string]::IsNullOrWhiteSpace([string]$doc.liteVelopackFramework)) {
              throw "Lite evidence missing liteVelopackFramework"
            }
            if ($doc.liteFrameworkFamily -notin @("desktop", "runtime")) {
              throw "Lite evidence has invalid liteFrameworkFamily"
            }
          }
      - name: Velopack package (${{ matrix.mode }} / ${{ matrix.rid }})
        if: matrix.mode == 'Lite'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "tb-vpk-${{ matrix.mode }}-${{ matrix.rid }}"
          ./scripts/package-velopack.ps1 -Rid ${{ matrix.rid }} -OutputRoot $root -DeploymentMode Lite
      - uses: actions/upload-artifact@v4
        with:
          name: app-evidence-${{ matrix.rid }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/tb-artifact-${{ matrix.mode }}-${{ matrix.rid }}/*/evidence.json
            ${{ runner.temp }}/tb-artifact-${{ matrix.mode }}-${{ matrix.rid }}/*/*.zip.sha256
            ${{ runner.temp }}/tb-vpk-${{ matrix.mode }}-${{ matrix.rid }}/releases/**
          if-no-files-found: warn
          retention-days: 3
